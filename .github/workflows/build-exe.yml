name: 打包成 Windows EXE

on:
  release:
    types: [created]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# 修复 403：声明写入 Release 所需权限
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 安装依赖和 PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: 验证文件结构
      run: |
        dir
        python -c "import streamlit; print('streamlit:', streamlit.__version__)"
        python -c "import langgraph; print('langgraph OK')"

    - name: PyInstaller 打包
      shell: powershell
      run: |
        pyinstaller --onefile `
          --name "whitepaper-workshop-v4" `
          --add-data 'workshop.py;.' `
          --collect-all streamlit `
          --collect-all langgraph `
          --collect-all langchain `
          --collect-all langchain_core `
          --collect-all langchain_community `
          --collect-all openai `
          --collect-all pandas `
          --collect-all numpy `
          --collect-all altair `
          --collect-all plotly `
          --collect-all pyarrow `
          --collect-all pydantic `
          --collect-all pydantic_core `
          --hidden-import=streamlit.web.cli `
          --hidden-import=streamlit.runtime.scriptrunner `
          --hidden-import=streamlit.runtime.scriptrunner.magic_funcs `
          --hidden-import=streamlit.elements `
          --hidden-import=streamlit.components.v1 `
          --hidden-import=langgraph.graph `
          --hidden-import=langgraph.checkpoint `
          --hidden-import=langchain_core.runnables `
          --hidden-import=openai `
          --hidden-import=pydantic `
          --hidden-import=pydantic.v1 `
          --hidden-import=pkg_resources.py2_warn `
          run_app.py

    - name: 验证打包产物
      run: dir dist\

    - name: 上传 EXE 到 Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        files: dist/*.exe
        overwrite_files: true